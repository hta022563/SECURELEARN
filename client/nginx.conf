server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Dòng này cực kỳ quan trọng: Nếu không tìm thấy file hoặc đường dẫn khớp, 
        # nó sẽ ép trả về index.html để React Router hoặc các thư viện (như Cognito callback) tự xử lý tiếp.
        try_files $uri $uri/ /index.html;
    }

    # (Tùy chọn) Phòng trường hợp bạn gọi API trực tiếp qua Nginx proxy
    # location /api {
    #     proxy_pass http://backend:8080;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }
}