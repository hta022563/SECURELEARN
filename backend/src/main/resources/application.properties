spring.application.name=SecureLearn

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/SecureLearn}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:12345}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# AWS Cognito OAuth2
spring.security.oauth2.client.registration.cognito.client-id=3082g3j8125sr1d7m6ojbingb4
spring.security.oauth2.client.registration.cognito.client-secret=${COGNITO_CLIENT_SECRET}
spring.security.oauth2.client.registration.cognito.scope=email,openid,phone
spring.security.oauth2.client.registration.cognito.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.cognito.issuer-uri=https://cognito-idp.ap-southeast-1.amazonaws.com/ap-southeast-1_ocn23tg3K
spring.security.oauth2.client.provider.cognito.user-name-attribute=username
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.ap-southeast-1.amazonaws.com/${COGNITO_POOL_ID:ap-southeast-1_ocn23tg3K}

# Cognito IDP (for AuthService \u00e2\u0080\u0094 register / login via USER_PASSWORD_AUTH)
cognito.user-pool-id=${COGNITO_POOL_ID:ap-southeast-1_ocn23tg3K}
cognito.client-id=${spring.security.oauth2.client.registration.cognito.client-id}
cognito.client-secret=${spring.security.oauth2.client.registration.cognito.client-secret}
cognito.region=${spring.cloud.aws.region.static:ap-southeast-1}

# CORS
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174}

# Spring Cloud AWS - region and credentials used by DynamoDbAutoConfiguration
spring.cloud.aws.region.static=ap-southeast-1

AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}

# Cloudflare R2 S3-compatible API
r2.endpoint=${R2_ENDPOINT:https://2040d6c8c8be5919ba5e72a4f5831548.r2.cloudflarestorage.com}
r2.region=${R2_REGION:auto}
r2.access-key=${R2_ACCESS_KEY}
r2.secret-key=${R2_SECRET_ACCESS_KEY}
r2.bucket-name=${R2_BUCKET_NAME:securelearnvideo}
app.s3.public-base-url=${R2_PUBLIC_URL}
playback.allow-external-https-urls=${PLAYBACK_ALLOW_EXTERNAL_HTTPS_URLS:false}

# Spring Cloud AWS - DynamoDB endpoint override (points to local container or real AWS)

