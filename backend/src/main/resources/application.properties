spring.application.name=SecureLearn

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/SecureLearn}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:12345}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# AWS Cognito OAuth2
spring.security.oauth2.client.registration.cognito.client-id=6dfhhe4nbsb5m1rrujnvsf08rm
spring.security.oauth2.client.registration.cognito.client-secret=${COGNITO_CLIENT_SECRET}
spring.security.oauth2.client.registration.cognito.scope=email,openid,phone
spring.security.oauth2.client.registration.cognito.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.cognito.issuer-uri=https://cognito-idp.ap-southeast-1.amazonaws.com/ap-southeast-1_ZlYH5RGBn
spring.security.oauth2.client.provider.cognito.user-name-attribute=username

# CORS
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174}

# Spring Cloud AWS - region and credentials used by DynamoDbAutoConfiguration
spring.cloud.aws.region.static=${AWS_DYNAMODB_REGION:ap-southeast-1}
spring.cloud.aws.credentials.access-key=${AWS_DYNAMODB_ACCESS_KEY:dummy}
spring.cloud.aws.credentials.secret-key=${AWS_DYNAMODB_SECRET_KEY:dummy}

# Spring Cloud AWS - DynamoDB endpoint override (points to local container or real AWS)
spring.cloud.aws.dynamodb.endpoint=${AWS_DYNAMODB_ENDPOINT:http://localhost:8000}
