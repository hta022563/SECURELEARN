services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: securelearn-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-SecureLearn}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-SecureLearn}"]
      interval: 10s
      timeout: 5s
      retries: 5      
  # Spring Boot Backend
  backend:
    build: .
    container_name: securelearn-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # PostgreSQL: the local container by default. Set DB_URL / DB_USERNAME / DB_PASSWORD in .env
      # to use RDS instead, so this backend shares one database with the Lambda functions.
      SPRING_DATASOURCE_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/${POSTGRES_DB:-SecureLearn}}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-${POSTGRES_USER:-postgres}}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file}}

      # JPA/Hibernate (set HIBERNATE_DDL_AUTO=validate when using RDS, so a local run never alters the shared schema)
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${HIBERNATE_DDL_AUTO:-update}
      SPRING_JPA_SHOW_SQL: ${SHOW_SQL:-false}

      # AWS Cognito
      COGNITO_CLIENT_SECRET: ${COGNITO_CLIENT_SECRET:?Set COGNITO_CLIENT_SECRET in the .env file}
      COGNITO_POOL_ID: ${COGNITO_POOL_ID:?Set COGNITO_POOL_ID in the .env file}

      # AWS S3 video bucket (signed with AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY below)
      S3_REGION: ${S3_REGION:-ap-southeast-1}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:?Set S3_BUCKET_NAME in the .env file}
      PLAYBACK_TOKEN_SECRET: ${PLAYBACK_TOKEN_SECRET:?Set PLAYBACK_TOKEN_SECRET in the .env file}

      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:5174}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID in the .env file}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY in the .env file}

      # MoMo (points at the local pay-sandbox service by default)
      MOMO_URL: ${MOMO_URL:-http://paySandbox:4242/momo}
      MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE:?Set MOMO_PARTNER_CODE in the .env file}
      MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY:?Set MOMO_ACCESS_KEY in the .env file}
      MOMO_SECRET_KEY: ${MOMO_SECRET_KEY:?Set MOMO_SECRET_KEY in the .env file}
      # The sandbox container reaches the backend by its compose service name, not localhost
      MOMO_IPN_URL: ${MOMO_IPN_URL:-http://backend:8080/api/momo/ipn}

  # Local MoMo/VNPay/ZaloPay/Stripe simulator (dev only, never deploy)
  paySandbox:
    image: node:22-alpine
    container_name: paySandbox
    restart: unless-stopped
    command: npx --yes pay-sandbox@0.1.2 --host 0.0.0.0
    ports:
      - "127.0.0.1:4242:4242"
volumes:
  postgres-data:
    driver: local

networks:
  default:
    name: securelearn-network
