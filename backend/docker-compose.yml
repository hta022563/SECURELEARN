services:
  dynamodb-local:
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    image: "amazon/dynamodb-local:latest"
    container_name: dynamodb-local
    ports:
      - "8000:8000"
    volumes:
      - "./docker/dynamodb:/home/dynamodblocal/data"
    working_dir: /home/dynamodblocal

  dynamodb-init:
    image: amazon/aws-cli
    depends_on:
      - dynamodb-local
    environment:
      AWS_ACCESS_KEY_ID: x
      AWS_SECRET_ACCESS_KEY: x
      AWS_DEFAULT_REGION: local
    entrypoint: /bin/sh
    command: >
      -c '
      until aws dynamodb list-tables --endpoint-url http://dynamodb-local:8000 >/dev/null 2>&1; do
        echo "waiting for dynamodb..."; sleep 1;
      done;
      aws dynamodb describe-table --table-name Course --endpoint-url http://dynamodb-local:8000 >/dev/null 2>&1 ||
      aws dynamodb create-table --table-name Course --attribute-definitions AttributeName=id,AttributeType=S AttributeName=Chapters,AttributeType=N --key-schema AttributeName=id,KeyType=HASH AttributeName=Chapters,KeyType=RANGE --billing-mode PAY_PER_REQUEST --endpoint-url http://dynamodb-local:8000
      '

  backend:
    build: .
    container_name: securelearn-backend
    ports:
      - "8080:8080"
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully
    environment:
      # Read from the .env file next to this compose file (never commit .env)
      COGNITO_CLIENT_SECRET: ${COGNITO_CLIENT_SECRET:?Set COGNITO_CLIENT_SECRET in the .env file}
      # Point the app at the DynamoDB container instead of localhost
      SPRING_CLOUD_AWS_DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      SPRING_CLOUD_AWS_REGION_STATIC: ap-southeast-1
      SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY: x
      SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY: x
