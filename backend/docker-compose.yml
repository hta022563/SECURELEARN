services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: securelearn-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-SecureLearn}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-SecureLearn}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # DynamoDB Local
  dynamodb-local:
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    image: "amazon/dynamodb-local:latest"
    container_name: dynamodb-local
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - "./docker/dynamodb:/home/dynamodblocal/data"
    working_dir: /home/dynamodblocal

  # DynamoDB Table Initialization
  dynamodb-init:
    image: amazon/aws-cli
    container_name: dynamodb-init
    depends_on:
      - dynamodb-local
    environment:
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      AWS_DEFAULT_REGION: ap-southeast-1
    entrypoint: /bin/sh
    command:
      - "-c"
      - |
        echo "Waiting for DynamoDB..."
        until aws dynamodb list-tables --endpoint-url http://dynamodb-local:8000 >/dev/null 2>&1; do sleep 1; done
        echo "DynamoDB ready."
        aws dynamodb describe-table --table-name Courses --endpoint-url http://dynamodb-local:8000 >/dev/null 2>&1 || aws dynamodb create-table --table-name Courses --attribute-definitions AttributeName=id,AttributeType=S AttributeName=Chapter,AttributeType=S --key-schema AttributeName=id,KeyType=HASH AttributeName=Chapter,KeyType=RANGE --billing-mode PAY_PER_REQUEST --endpoint-url http://dynamodb-local:8000
        echo "DynamoDB initialized."

  # Spring Boot Backend
  backend:
    build: .
    container_name: securelearn-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      dynamodb-init:
        condition: service_completed_successfully
    environment:
      # PostgreSQL
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-SecureLearn}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file}

      # JPA/Hibernate
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${HIBERNATE_DDL_AUTO:-update}
      SPRING_JPA_SHOW_SQL: ${SHOW_SQL:-false}

      # AWS Cognito
      COGNITO_CLIENT_SECRET: ${COGNITO_CLIENT_SECRET:?Set COGNITO_CLIENT_SECRET in the .env file}

      # Spring Cloud AWS / DynamoDB — must match spring.cloud.aws.* property keys
      AWS_DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      AWS_DYNAMODB_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_DYNAMODB_ACCESS_KEY: dummy
      AWS_DYNAMODB_SECRET_KEY: dummy

      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:5174}

volumes:
  postgres-data:
    driver: local

networks:
  default:
    name: securelearn-network
