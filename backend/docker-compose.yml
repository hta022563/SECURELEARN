services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: securelearn-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-SecureLearn}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-SecureLearn}"]
      interval: 10s
      timeout: 5s
      retries: 5      
  # Spring Boot Backend
  backend:
    build: .
    container_name: securelearn-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # PostgreSQL
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-SecureLearn}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file}

      # JPA/Hibernate
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${HIBERNATE_DDL_AUTO:-update}
      SPRING_JPA_SHOW_SQL: ${SHOW_SQL:-false}

      # AWS Cognito
      COGNITO_CLIENT_SECRET: ${COGNITO_CLIENT_SECRET:?Set COGNITO_CLIENT_SECRET in the .env file}
      COGNITO_POOL_ID: ${COGNITO_POOL_ID:?Set COGNITO_POOL_ID in the .env file}

      # Cloudflare R2
      R2_ENDPOINT: ${R2_ENDPOINT:-https://2040d6c8c8be5919ba5e72a4f5831548.r2.cloudflarestorage.com}
      R2_REGION: ${R2_REGION:-auto}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:?Set R2_BUCKET_NAME in the .env file}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:?Set R2_PUBLIC_URL in the .env file}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY:?Set R2_ACCESS_KEY in the .env file}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?Set R2_SECRET_ACCESS_KEY in the .env file}

      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:5174}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID in the .env file}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY in the .env file}

volumes:
  postgres-data:
    driver: local

networks:
  default:
    name: securelearn-network
